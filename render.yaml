services:
  - type: web
    name: oralcardio-api
    runtime: docker
    plan: free
    rootDir: backend
    healthCheckPath: /api/v1/health/ready
    autoDeploy: false
    envVars:
      - key: ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: WEB_PUSH_VAPID_PUBLIC_KEY
        sync: false
      - key: WEB_PUSH_VAPID_PRIVATE_KEY
        sync: false
      - key: WEB_PUSH_VAPID_SUBJECT
        sync: false
      - key: WEB_PUSH_VAPID_KEY_VERSION
        value: "1"
      - key: NOTIFICATION_DISPATCH_TOKEN
        sync: false
