[project]
name = "cardio-care-backend"
version = "0.1.0"
description = "CardioCare Connect — API (FastAPI)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Depends(...) como default de argumento é o padrão idiomático do FastAPI.
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]